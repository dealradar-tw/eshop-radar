name: 一次性簡轉繁修正
on:
  push:
    paths: [".github/workflows/zhfix.yml"]
concurrency:
  group: zhfix
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install opencc-python-reimplemented
      - run: python scripts/zhfix.py | tee zhfix.log
      - name: 儲存
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add docs/zhnames.json
          git diff --cached --quiet && exit 0
          git commit -m "簡體中文名稱轉台灣用字（一次性）"
          for i in 1 2 3; do
            git fetch origin main
            git rebase -X theirs origin/main && git push && exit 0
            git rebase --abort || true
            sleep 10
          done
          exit 1
