name: 每日更新價格

on:
  schedule:
    - cron: "10 18 * * *"   # 台灣時間每天 02:10
    - cron: "10 6 * * *"    # 台灣時間每天 14:10
    - cron: "40 19 * * 0"   # 台灣時間每週一 03:40：完整重掃
  workflow_dispatch:
    inputs:
      full:
        description: "完整重掃全部編號（約 30 分鐘）"
        type: boolean
        default: false
      test_notify:
        description: "只發一則測試通知（不更新價格）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 更新價格與遊戲資料
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ "${{ inputs.test_notify }}" = "true" ]; then
            python scripts/update.py --test-notify
          elif [ "${{ github.event.schedule }}" = "40 19 * * 0" ] || [ "${{ inputs.full }}" = "true" ]; then
            python scripts/update.py --full
          else
            python scripts/update.py
          fi

      - name: 儲存結果
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "沒有變動"
            exit 0
          fi
          git commit -m "更新價格 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git fetch origin main
            git rebase -X theirs origin/main && git push && exit 0
            git rebase --abort || true
            sleep 10
          done
          exit 1
