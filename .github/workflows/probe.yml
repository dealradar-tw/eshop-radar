name: probe
on: workflow_dispatch
permissions: {contents: write}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/probe.py
      - if: always()
        run: |
          git config user.name probe; git config user.email p@x
          git add -f probe/out; git commit -m "probe out"; git pull --rebase; git push
