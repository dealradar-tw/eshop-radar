name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe.py > probe.txt 2>&1 || true
      - run: |
          git config user.name github-actions; git config user.email a@b.c
          git add -f probe.txt; git commit -qm "probe result"; git push
