name: 偵測資料介面

on:
  push:
    paths: ["probe/probe.py", "probe/run.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python probe/probe.py
      - name: 儲存結果
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add probe/out
          git diff --cached --quiet && exit 0
          git commit -m "偵測結果"
          for i in 1 2 3; do git fetch origin main && git rebase -X theirs origin/main && git push && exit 0; git rebase --abort || true; sleep 10; done
          exit 1
